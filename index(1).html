<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Finanzas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo">$</span>
    <div>
      <h1>Mis Finanzas</h1>
      <small id="subtitulo">Datos guardados en este navegador</small>
    </div>
  </div>
  <div class="top-actions">
    <button class="btn primary" id="btnNuevo">+ Movimiento</button>
    <button class="btn ghost icon" id="btnTema" title="Cambiar tema">◐</button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<nav class="tabs" id="tabs">
  <button data-tab="resumen" class="active">Resumen</button>
  <button data-tab="movimientos">Movimientos</button>
  <button data-tab="deudas">Deudas</button>
  <button data-tab="cuotas">Cuotas y proyección</button>
  <button data-tab="prestamos">Préstamos</button>
  <button data-tab="servicios">Servicios</button>
  <button data-tab="reportes">Reportes</button>
  <button data-tab="datos">Datos y respaldos</button>
</nav>

<main>
  <!-- RESUMEN -->
  <section id="tab-resumen" class="tab active">
    <div class="toolbar">
      <label>Mes <select id="mesSel"></select></label>
      <button class="btn ghost small" id="mesPrev">‹</button>
      <button class="btn ghost small" id="mesNext">›</button>
    </div>
    <div id="resumenBody"></div>
  </section>

  <!-- MOVIMIENTOS -->
  <section id="tab-movimientos" class="tab">
    <div class="filters">
      <input type="search" id="fTexto" placeholder="Buscar nombre o nota…">
      <label>Desde <input type="month" id="fDesde"></label>
      <label>Hasta <input type="month" id="fHasta"></label>
      <select id="fCategoria"><option value="">Todas las categorías</option></select>
      <select id="fCuenta"><option value="">Todas las cuentas</option></select>
      <select id="fPersona"><option value="">Todas las personas</option></select>
      <select id="fSigno">
        <option value="">Ingresos y gastos</option>
        <option value="gasto">Solo gastos</option>
        <option value="ingreso">Solo ingresos</option>
      </select>
      <label class="chk"><input type="checkbox" id="fPend"> Solo futuros</label>
      <button class="btn ghost small" id="fLimpiar">Limpiar</button>
    </div>
    <div class="bulk" id="bulk" hidden>
      <span id="bulkCount"></span>
      <button class="btn small" data-bulk="categoria">Cambiar categoría</button>
      <button class="btn small" data-bulk="persona">Asignar persona</button>
      <button class="btn small" data-bulk="ok">Marcar cobrado</button>
      <button class="btn small danger" data-bulk="borrar">Eliminar</button>
    </div>
    <div class="table-wrap"><table class="grid" id="tablaMovs"></table></div>
  </section>

  <!-- CUOTAS -->
  <section id="tab-cuotas" class="tab">
    <div id="cuotasBody"></div>
  </section>

  <!-- PRESTAMOS -->
  <!-- DEUDAS -->
  <section id="tab-deudas" class="tab">
    <div id="deudasBody"></div>
  </section>

  <!-- SERVICIOS -->
  <section id="tab-servicios" class="tab">
    <div id="serviciosBody"></div>
  </section>

  <section id="tab-prestamos" class="tab">
    <div id="prestamosBody"></div>
  </section>

  <!-- REPORTES -->
  <section id="tab-reportes" class="tab">
    <div class="toolbar noprint">
      <label>Desde <input type="month" id="rDesde"></label>
      <label>Hasta <input type="month" id="rHasta"></label>
      <button class="btn ghost small" data-rango="3">3 meses</button>
      <button class="btn ghost small" data-rango="6">6 meses</button>
      <button class="btn ghost small" data-rango="12">12 meses</button>
      <span class="spacer"></span>
      <button class="btn small" id="rCsv">Exportar CSV</button>
      <button class="btn small primary" id="rPrint">Imprimir / PDF</button>
    </div>
    <div id="reporteBody"></div>
  </section>

  <!-- DATOS -->
  <section id="tab-datos" class="tab">
    <div id="datosBody"></div>
  </section>
</main>

<!-- Diálogo: nuevo movimiento -->
<dialog id="dlgNuevo">
  <form method="dialog" id="formNuevo">
    <h2>Nuevo movimiento</h2>
    <div class="seg" id="nClase">
      <label><input type="radio" name="clase" value="gasto" checked> Gasto</label>
      <label><input type="radio" name="clase" value="ingreso"> Ingreso</label>
      <label><input type="radio" name="clase" value="prestamo"> Préstamo a tercero</label>
    </div>
    <div class="form-grid">
      <label class="span2">Nombre <input name="nombre" required list="dlNombres" autocomplete="off"></label>
      <label>Fecha de compra <input type="date" name="fecha" required></label>
      <label>Cuenta / medio <input name="cuenta" list="dlCuentas" required></label>
      <label>Categoría <input name="categoria" list="dlCategorias" required></label>
      <p class="tj-info span2" id="nTarjeta"></p>
      <label class="solo-prestamo span2">Persona a la que le prestas <input name="persona" list="dlPersonas" placeholder="Marta, Erika, Omar…"></label>
      <label>Valor de la compra <input name="monto" inputmode="decimal" required></label>
      <label>Número de cuotas <input type="number" name="cuotas" min="1" max="72" value="1"></label>
      <div class="solo-cuotas span2 tasa-row">
        <label>Tasa de interés <input name="tasa" inputmode="decimal" placeholder="Ej. 1,89"></label>
        <label>Tipo de tasa
          <select name="tipoTasa"><option value="MV">% mensual (MV)</option><option value="EA">% efectivo anual (EA)</option></select>
        </label>
        <label>Valor por cuota <input name="valorCuota" inputmode="decimal"><small>Se calcula con la tasa; cámbialo si el banco te dio otro valor</small></label>
      </div>
      <label>Primer mes de pago <input type="month" name="mes" required><small id="nMesHint"></small></label>
      <label class="solo-prestamo">Te lo devuelven
        <select name="desfase">
          <option value="0">el mismo mes de cada cuota</option>
          <option value="-1">un mes antes (adelantado)</option>
          <option value="1">un mes después</option>
        </select>
      </label>
      <label class="span2">Notas <input name="notas"></label>
    </div>
    <div class="preview" id="nPreview"></div>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" data-close>Cancelar</button>
      <button type="submit" class="btn primary" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Diálogo: editar movimiento -->
<dialog id="dlgEditar">
  <form method="dialog" id="formEditar">
    <h2>Editar movimiento</h2>
    <div class="form-grid">
      <label class="span2">Nombre <input name="nombre" required></label>
      <label>Fecha de compra <input type="date" name="fecha"></label>
      <label>Mes de pago <input type="month" name="mes" required></label>
      <label>Cuenta / medio <input name="cuenta" list="dlCuentas"></label>
      <label>Categoría <input name="categoria" list="dlCategorias"></label>
      <label>Persona (solo préstamos) <input name="persona" list="dlPersonas" placeholder="Vacío = Miguel"></label>
      <label>Tipo
        <select name="signo"><option value="-1">Gasto (sale dinero)</option><option value="1">Ingreso (entra dinero)</option></select>
      </label>
      <label>Valor de esta cuota <input name="valor" inputmode="decimal" required></label>
      <label>Monto total de la compra <input name="monto" inputmode="decimal"></label>
      <label>Cuota # <input type="number" name="cuota" min="1"></label>
      <label>De (total cuotas) <input type="number" name="cuotas" min="1"></label>
      <label class="span2">Notas <input name="notas"></label>
      <label class="e-prest">Te devuelven en <input type="month" name="mesCobro"></label>
      <label class="e-prest">Recibido hasta ahora <input name="recibido" inputmode="decimal"></label>
      <label class="chk span2 e-prest"><input type="checkbox" name="ok"> Cobrado completo</label>
      <label class="chk span2" id="eGrupoWrap"><input type="checkbox" name="grupo"> <span id="eGrupoTxt"></span></label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="btn danger ghost" id="eBorrar">Eliminar</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-close>Cancelar</button>
      <button type="submit" class="btn primary" value="ok">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Diálogo: detalle de préstamo -->
<dialog id="dlgPrestamo" class="wide">
  <form method="dialog">
    <div class="section-title"><h2 id="pTitulo"></h2><button type="button" class="btn ghost icon" data-close title="Cerrar">✕</button></div>
    <div id="pCuerpo" class="p-cuerpo"></div>
    <div class="dlg-actions" id="pAcciones"></div>
  </form>
</dialog>

<!-- Diálogo: detalle de un valor agrupado -->
<dialog id="dlgDetalle" class="wide">
  <form method="dialog">
    <div class="section-title"><h2 id="dTitulo"></h2><button type="button" class="btn ghost icon" data-close title="Cerrar">✕</button></div>
    <div id="dCuerpo" class="p-cuerpo"></div>
    <div class="dlg-actions"><button type="button" class="btn" data-act="exportarDetalle">Exportar CSV</button><span class="spacer"></span><button type="button" class="btn primary" data-close>Cerrar</button></div>
  </form>
</dialog>

<!-- Diálogo genérico -->
<dialog id="dlgMsg">
  <form method="dialog">
    <h2 id="mTitulo"></h2>
    <div id="mCuerpo"></div>
    <div class="dlg-actions" id="mAcciones"></div>
  </form>
</dialog>

<datalist id="dlCuentas"></datalist>
<datalist id="dlCategorias"></datalist>
<datalist id="dlPersonas"></datalist>
<datalist id="dlNombres"></datalist>

<input type="file" id="fileJson" accept=".json,application/json" hidden>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
<script src="calendario.js"></script>
</body>
</html>
